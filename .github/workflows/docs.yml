name: 'Docs'

# The documentation site (docs-site, Astro Starlight) on GitHub Pages:
# https://giosci1994.github.io/floor3d-card/
on:
  push:
    branches:
      - master
    paths:
      - 'docs-site/**'
      - 'docs/images/**'
      - '.github/workflows/docs.yml'
      # the card and the house of the live demo of the home page
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'rollup.config.mjs'
      - 'test/browser/model.mjs'
  pull_request:
    branches:
      - master
    paths:
      - 'docs-site/**'
      - 'docs/images/**'
      - '.github/workflows/docs.yml'
      # the card and the house of the live demo of the home page
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'rollup.config.mjs'
      - 'test/browser/model.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the date each page was last updated comes from git
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # The live demo of the home page runs the card of this commit (docs-site/scripts/demo.mjs).
      - name: Build the card
        run: |
          npx --yes yarn@1.22.22 install --frozen-lockfile
          npm run build
      - name: Build
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/dist

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
