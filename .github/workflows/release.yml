name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Build: dist/ is not in the repository, the files of the release are built here from the tag.
      - name: Build the files
        run: |
          npx --yes yarn@1.22.22 install --frozen-lockfile
          npm run build

      # Upload the card and the files it loads (core, and on demand the editor and the decoders of
      # compressed models, the Draco one with its .wasm) to the release. HACS downloads all the
      # assets of the release into www/community/floor3d-card/.
      - name: Upload files to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
